<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Latihan Soal Faktorisasi Prima Interaktif">
    <title>Latihan Faktorisasi Prima</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2F3E46;
            --bg-game: #F7FFF7;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: linear-gradient(180deg, #74b9ff 0%, #a29bfe 100%);
            padding: 10px; 
            color: var(--dark); 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-card { 
            width: 100%;
            max-width: 450px; 
            background: var(--bg-game); 
            padding: 20px; 
            border-radius: 30px; 
            box-shadow: 0 12px 0px rgba(0,0,0,0.15), inset 0 -8px 0px rgba(0,0,0,0.05);
            border: 4px solid var(--dark);
            position: relative;
        }

        h2 { 
            font-family: 'Fredoka One', cursive;
            text-align: center; 
            color: #2d3436; 
            font-size: 24px;
            margin: 0 0 5px 0;
            text-shadow: 3px 3px 0px var(--accent);
        }

        .subtitle {
            text-align: center; 
            font-size: 13px; 
            color: #636e72; 
            font-weight: 700;
            margin-bottom: 15px;
        }

        .question-card {
            background: #fff;
            border: 3px solid var(--dark);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.05);
        }

        .question-header {
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            color: #0984e3;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-q {
            background: var(--accent);
            padding: 4px 10px;
            border-radius: 10px;
            border: 2px solid var(--dark);
            color: var(--dark);
            font-size: 12px;
        }

        .tree-container {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 10px 0;
        }

        .tree-input {
            width: 45px;
            height: 38px;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            border: 2px solid var(--dark);
            border-radius: 10px;
            outline: none;
            background: #fffdf0;
        }

        .tree-input:focus {
            border-color: #e67e22;
            background: #fff;
        }

        .final-input-group {
            margin-top: 15px;
            background: #f0f7ff;
            padding: 10px;
            border-radius: 12px;
            border: 2px dashed #74b9ff;
        }

        .final-input-label {
            font-size: 12px;
            font-weight: 800;
            color: #2d3436;
            margin-bottom: 5px;
            display: block;
        }

        .final-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--dark);
            border-radius: 10px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .node-ellipse { fill: #fff; stroke: var(--dark); stroke-width: 3; }
        .node-text { font-family: 'Fredoka One', cursive; font-size: 14px; fill: var(--dark); text-anchor: middle; dominant-baseline: middle; }
        .line { stroke: var(--dark); stroke-width: 3; stroke-linecap: round; }

        .button-group { 
            display: flex; 
            gap: 10px; 
            justify-content: center;
            margin-top: 15px;
        }
        
        .btn-action { 
            flex: 1;
            padding: 12px; 
            border: 3px solid var(--dark); 
            border-radius: 18px; 
            cursor: pointer; 
            font-family: 'Fredoka One', cursive;
            font-size: 14px; 
            position: relative;
        }

        .btn-check { background: #4ECDC4; color: white; box-shadow: 0 6px 0px var(--dark); }
        .btn-check:active { transform: translateY(4px); box-shadow: 0 2px 0px var(--dark); }

        .btn-reset { background: #ff7675; color: white; box-shadow: 0 6px 0px var(--dark); }
        .btn-reset:active { transform: translateY(4px); box-shadow: 0 2px 0px var(--dark); }

        .btn-home { background: #74b9ff; color: white; box-shadow: 0 6px 0px var(--dark); }
        .btn-home:active { transform: translateY(4px); box-shadow: 0 2px 0px var(--dark); }

        .score-board {
            display: none;
            text-align: center;
            background: #fff;
            border: 3px solid var(--dark);
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 6px 0px var(--accent);
        }

        .score-title { font-family: 'Fredoka One', cursive; font-size: 20px; color: #2d3436; }
        .score-val { font-family: 'Fredoka One', cursive; font-size: 32px; color: #0984e3; }
    </style>
</head>
<body>

<div class="game-card">
    <h2>Latihan Faktorisasi Prima</h2>
    <div class="subtitle">Lengkapi Pohon Faktor & Tulis Hasilnya! 🌳</div>

    <div id="quiz-container"></div>

    <div class="button-group">
        <button class="btn-action btn-check" onclick="checkAnswers()">PERIKSA</button>
        <button class="btn-action btn-reset" onclick="generateQuiz()">ACAK SOAL</button>
        <button class="btn-action btn-home" onclick="goToIndex()">🏠 MENU</button>
    </div>

    <div id="scoreBoard" class="score-board">
        <div class="score-title">Nilai Kamu:</div>
        <div id="scoreValue" class="score-val">0</div>
        <div id="scoreMsg" style="font-size: 13px; font-weight: 800; color: #636e72;"></div>
    </div>
</div>

<script>
let quizData = [];

function goToIndex() {
    window.location.href = 'index.html';
}

function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
    }
    return true;
}

// Menghitung jumlah total faktor prima (misal 12 -> 2,2,3 = 3 faktor)
function countPrimeFactors(num) {
    let count = 0;
    let curr = num;
    let d = 2;
    while (curr > 1) {
        if (curr % d === 0) {
            count++;
            curr /= d;
        } else {
            d++;
        }
    }
    return count;
}

// Menghasilkan angka acak <= 200 yang memiliki 3 sampai 5 faktor prima
function getRandomIdealCompositeNumber() {
    let num;
    let factorCount;
    do {
        num = Math.floor(Math.random() * 190) + 10; // 10 - 200
        factorCount = countPrimeFactors(num);
    } while (factorCount < 3 || factorCount > 5);
    return num;
}

function getFactorSteps(n) {
    let steps = [];
    let curr = n;
    let d = 2;
    while (curr > 1 && !isPrime(curr)) {
        if (curr % d === 0) {
            let nextN = curr / d;
            steps.push({ prime: d, remainder: nextN });
            curr = nextN;
        } else {
            d++;
        }
    }
    return steps;
}

function getFactorString(n) {
    let curr = n;
    let d = 2;
    let factors = {};
    while (curr > 1) {
        if (curr % d === 0) {
            factors[d] = (factors[d] || 0) + 1;
            curr /= d;
        } else {
            d++;
        }
    }
    return Object.entries(factors).map(([b, e]) => e > 1 ? `${b}^${e}` : `${b}`).join('x');
}

function generateQuiz() {
    document.getElementById('scoreBoard').style.display = 'none';
    quizData = [];
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    while (quizData.length < 5) {
        let n = getRandomIdealCompositeNumber();
        if (!quizData.some(q => q.number === n)) {
            let steps = getFactorSteps(n);
            let factorStr = getFactorString(n);
            quizData.push({ number: n, steps: steps, factorStr: factorStr });
        }
    }

    quizData.forEach((q, idx) => {
        let card = document.createElement('div');
        card.className = 'question-card';

        let header = `<div class="question-header">
            <span>Soal #${idx + 1}: Pohon Faktor untuk <b>${q.number}</b></span>
            <span class="badge-q">Max 200</span>
        </div>`;

        let svgHeight = q.steps.length * 60 + 50;
        let svgWidth = 320;
        let svgHtml = `<svg width="${svgWidth}" height="${svgHeight}" style="overflow:visible;">`;

        let curX = svgWidth / 2;
        let curY = 30;
        let offset = 40;

        // Root Node
        svgHtml += `<ellipse cx="${curX}" cy="${curY}" rx="22" ry="18" class="node-ellipse"/>`;
        svgHtml += `<text x="${curX}" y="${curY}" class="node-text">${q.number}</text>`;

        q.steps.forEach((step, sIdx) => {
            let leftX = curX - offset;
            let rightX = curX + offset;
            let nextY = curY + 60;

            // Lines
            svgHtml += `<line x1="${curX}" y1="${curY+18}" x2="${leftX}" y2="${nextY-18}" class="line"/>`;
            svgHtml += `<line x1="${curX}" y1="${curY+18}" x2="${rightX}" y2="${nextY-18}" class="line"/>`;

            // Left Input (Pembagi Prima)
            svgHtml += `<foreignObject x="${leftX - 22}" y="${nextY - 18}" width="45" height="38">
                <input type="number" class="tree-input" data-q="${idx}" data-type="prime" data-step="${sIdx}">
            </foreignObject>`;

            // Right Input (Sisa / Bilangan Prima Terakhir)
            svgHtml += `<foreignObject x="${rightX - 22}" y="${nextY - 18}" width="45" height="38">
                <input type="number" class="tree-input" data-q="${idx}" data-type="rem" data-step="${sIdx}">
            </foreignObject>`;

            curX = rightX;
            curY = nextY;
        });

        svgHtml += `</svg>`;

        let finalInput = `<div class="final-input-group">
            <span class="final-input-label">Tuliskan Faktorisasi Prima (contoh: 2^2x3 atau 2x3x5):</span>
            <input type="text" class="final-input" id="final-ans-${idx}" placeholder="Contoh: 2^2x3" data-q="${idx}">
        </div>`;

        card.innerHTML = header + `<div class="tree-container">${svgHtml}</div>` + finalInput;
        container.appendChild(card);
    });
}

function checkAnswers() {
    let score = 0;

    quizData.forEach((q, idx) => {
        let isCorrect = true;

        q.steps.forEach((step, sIdx) => {
            let pInput = document.querySelector(`input[data-q="${idx}"][data-type="prime"][data-step="${sIdx}"]`);
            if (pInput) {
                if (parseInt(pInput.value) === step.prime) {
                    pInput.style.borderColor = '#2ecc71';
                    pInput.style.backgroundColor = '#e8f8f5';
                } else {
                    pInput.style.borderColor = '#e74c3c';
                    pInput.style.backgroundColor = '#fadbd8';
                    isCorrect = false;
                }
            }

            let rInput = document.querySelector(`input[data-q="${idx}"][data-type="rem"][data-step="${sIdx}"]`);
            if (rInput) {
                if (parseInt(rInput.value) === step.remainder) {
                    rInput.style.borderColor = '#2ecc71';
                    rInput.style.backgroundColor = '#e8f8f5';
                } else {
                    rInput.style.borderColor = '#e74c3c';
                    rInput.style.backgroundColor = '#fadbd8';
                    isCorrect = false;
                }
            }
        });

        let fInput = document.getElementById(`final-ans-${idx}`);
        let userAns = fInput.value.toLowerCase().replace(/\s+/g, '').replace(/[*×]/g, 'x');
        
        let altAns = [];
        let rawFactors = [];
        q.steps.forEach(s => rawFactors.push(s.prime));
        rawFactors.push(q.steps[q.steps.length - 1].remainder);

        altAns.push(rawFactors.join('x'));
        altAns.push(q.factorStr.toLowerCase());

        if (altAns.includes(userAns)) {
            fInput.style.borderColor = '#2ecc71';
            fInput.style.backgroundColor = '#e8f8f5';
        } else {
            fInput.style.borderColor = '#e74c3c';
            fInput.style.backgroundColor = '#fadbd8';
            isCorrect = false;
        }

        if (isCorrect) score += 20;
    });

    let scoreBoard = document.getElementById('scoreBoard');
    let scoreVal = document.getElementById('scoreValue');
    let scoreMsg = document.getElementById('scoreMsg');

    scoreBoard.style.display = 'block';
    scoreVal.textContent = score;

    if (score === 100) {
        scoreMsg.textContent = "Sempurna! Kamu Hebat Sekali! 🎉";
    } else if (score >= 60) {
        scoreMsg.textContent = "Bagus! Teruskan berlatih ya! 👍";
    } else {
        scoreMsg.textContent = "Jangan menyerah, ayo coba lagi! 💪";
    }

    scoreBoard.scrollIntoView({ behavior: 'smooth' });
}

window.onload = generateQuiz;
</script>
</body>
</html>
