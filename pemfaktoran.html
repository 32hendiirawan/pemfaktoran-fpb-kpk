<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Aplikasi Faktorisasi Prima dan Pohon Faktor Interaktif">
    <title>Faktorisasi Prima & Pohon Faktor</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2F3E46;
            --bg-game: #F7FFF7;
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: linear-gradient(180deg, #74b9ff 0%, #a29bfe 100%);
            padding: 10px; 
            color: var(--dark); 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-card { 
            width: 100%;
            max-width: 420px; 
            background: var(--bg-game); 
            padding: 25px 20px; 
            border-radius: 30px; 
            box-shadow: 0 12px 0px rgba(0,0,0,0.15), inset 0 -8px 0px rgba(0,0,0,0.05);
            border: 4px solid var(--dark);
            text-align: center;
            position: relative;
        }

        h2 { 
            font-family: 'Fredoka One', cursive;
            color: #2d3436; 
            font-size: 26px;
            margin: 0 0 5px 0;
            text-shadow: 3px 3px 0px var(--accent);
        }

        .subtitle {
            font-size: 13px; 
            color: #636e72; 
            font-weight: 700;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .num-input {
            flex: 1;
            padding: 12px;
            border: 3px solid var(--dark);
            border-radius: 16px;
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            text-align: center;
            outline: none;
            background: #fff;
            box-shadow: inset 0 4px 0px rgba(0,0,0,0.05);
        }

        .btn-calc {
            background: var(--secondary);
            color: white;
            border: 3px solid var(--dark);
            border-radius: 16px;
            padding: 0 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0px var(--dark);
        }

        .btn-calc:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px var(--dark);
        }

        .result-box {
            background: #fff;
            border: 3px solid var(--dark);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 6px 0px rgba(0,0,0,0.05);
        }

        .tree-container {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 10px 0;
        }

        .node-ellipse { fill: #fff; stroke: var(--dark); stroke-width: 3; }
        .prime-ellipse { fill: #ff7675; stroke: var(--dark); stroke-width: 3; } 
        .node-text { font-family: 'Fredoka One', cursive; font-size: 15px; fill: var(--dark); text-anchor: middle; dominant-baseline: middle; }
        .line { stroke: var(--dark); stroke-width: 3; stroke-linecap: round; }

        .factor-summary {
            background: #f0f7ff;
            border: 2px dashed #74b9ff;
            border-radius: 14px;
            padding: 12px;
            margin-top: 15px;
            font-weight: 800;
            font-size: 15px;
            color: #2d3436;
        }

        .factor-highlight {
            font-family: 'Fredoka One', cursive;
            color: #d63031;
            font-size: 18px;
        }

        .btn-home {
            display: block;
            width: 100%;
            padding: 12px;
            background: #74b9ff;
            color: white;
            border: 3px solid var(--dark);
            border-radius: 18px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 0px var(--dark);
        }

        .btn-home:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px var(--dark);
        }
    </style>
</head>
<body>

<div class="game-card">
    <h2>Faktorisasi Prima</h2>
    <div class="subtitle">Cari Pohon Faktor & Faktorisasi Prima 🌳</div>

    <div class="input-group">
        <input type="number" id="inputNum" class="num-input" placeholder="Masukkan Angka" min="2" max="1000">
        <button class="btn-calc" onclick="calculateFactor()">HITUNG</button>
    </div>

    <div id="resultBox" class="result-box">
        <div style="font-family: 'Fredoka One', cursive; font-size: 16px; color: #0984e3; margin-bottom: 10px;">
            Pohon Faktor:
        </div>
        <div class="tree-container" id="treeContainer"></div>
        <div class="factor-summary" id="factorSummary"></div>
    </div>

    <a href="index.html" class="btn-home">🏠 KEMBALI KE MENU</a>
</div>

<script>
function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
    }
    return true;
}

// Menghasilkan langkah pohon faktor tanpa membagi sampai x 1
function generateFactorTree(n) {
    let steps = [];
    let curr = n;
    let d = 2;

    while (curr > 1 && !isPrime(curr)) {
        if (curr % d === 0) {
            let nextN = curr / d;
            steps.push({ prime: d, remainder: nextN });
            curr = nextN;
        } else {
            d++;
        }
    }
    return steps;
}

function getFactorString(n) {
    let curr = n;
    let d = 2;
    let factors = {};

    while (curr > 1) {
        if (curr % d === 0) {
            factors[d] = (factors[d] || 0) + 1;
            curr /= d;
        } else {
            d++;
        }
    }

    let parts = [];
    Object.entries(factors).forEach(([b, e]) => {
        parts.push(e > 1 ? `${b}<sup>${e}</sup>` : `${b}`);
    });

    return parts.join(' × ');
}

function calculateFactor() {
    let inputEl = document.getElementById('inputNum');
    let num = parseInt(inputEl.value);

    if (isNaN(num) || num < 2) {
        alert('Masukkan bilangan bulat positif minimal 2!');
        return;
    }

    let resultBox = document.getElementById('resultBox');
    let treeContainer = document.getElementById('treeContainer');
    let factorSummary = document.getElementById('factorSummary');

    resultBox.style.display = 'block';

    if (isPrime(num)) {
        treeContainer.innerHTML = `<div style="padding: 10px; font-weight:800; color:#e17055;">
            Angka ${num} adalah Bilangan Prima!
        </div>`;
        factorSummary.innerHTML = `Faktorisasi Prima dari ${num} = <span class="factor-highlight">${num}</span>`;
        return;
    }

    let steps = generateFactorTree(num);
    let svgHeight = steps.length * 60 + 50;
    let svgWidth = 320;
    let svgHtml = `<svg width="${svgWidth}" height="${svgHeight}" style="overflow:visible;">`;

    let curX = svgWidth / 2;
    let curY = 30;
    let offset = 45;

    // Node Utama (Akar)
    svgHtml += `<ellipse cx="${curX}" cy="${curY}" rx="24" ry="20" class="node-ellipse"/>`;
    svgHtml += `<text x="${curX}" y="${curY}" class="node-text">${num}</text>`;

    steps.forEach((step, idx) => {
        let leftX = curX - offset;
        let rightX = curX + offset;
        let nextY = curY + 60;

        // Garis cabang
        svgHtml += `<line x1="${curX}" y1="${curY+20}" x2="${leftX}" y2="${nextY-20}" class="line"/>`;
        svgHtml += `<line x1="${curX}" y1="${curY+20}" x2="${rightX}" y2="${nextY-20}" class="line"/>`;

        // Node Kiri (Bilangan Prima)
        svgHtml += `<ellipse cx="${leftX}" cy="${nextY}" rx="24" ry="20" class="prime-ellipse"/>`;
        svgHtml += `<text x="${leftX}" y="${nextY}" class="node-text" style="fill:white;">${step.prime}</text>`;

        // Node Kanan (Sisa Pembagian)
        if (idx === steps.length - 1) {
            // Jika langkah terakhir, sisa pembagian adalah bilangan prima (daun akhir)
            svgHtml += `<ellipse cx="${rightX}" cy="${nextY}" rx="24" ry="20" class="prime-ellipse"/>`;
            svgHtml += `<text x="${rightX}" y="${nextY}" class="node-text" style="fill:white;">${step.remainder}</text>`;
        } else {
            // Sisa pembagian masih berupa komposit
            svgHtml += `<ellipse cx="${rightX}" cy="${nextY}" rx="24" ry="20" class="node-ellipse"/>`;
            svgHtml += `<text x="${rightX}" y="${nextY}" class="node-text">${step.remainder}</text>`;
        }

        curX = rightX;
        curY = nextY;
    });

    svgHtml += `</svg>`;
    treeContainer.innerHTML = svgHtml;

    let factorStr = getFactorString(num);
    factorSummary.innerHTML = `Faktorisasi Prima dari ${num}:<br><span class="factor-highlight">${factorStr}</span>`;
}
</script>

</body>
</html>
